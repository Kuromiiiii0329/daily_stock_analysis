<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票分析 · Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --brand:    #2563eb;
      --brand-lt: #eff6ff;
      --green:    #16a34a;
      --red:      #dc2626;
      --amber:    #d97706;
      --gray-50:  #f9fafb;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* Tab panel visibility */
    .tab-panel          { display: none; }
    .tab-panel.active   { display: block; }

    /* Nav tab button states */
    .nav-tab            { transition: all .15s; }
    .nav-tab.active     { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); color: #1e40af; }

    /* Form controls */
    .form-input, .form-select {
      width: 100%; padding: .5rem .75rem;
      border: 1.5px solid #e5e7eb; border-radius: .5rem;
      font-size: .875rem; background: #fff; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-input:focus, .form-select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    /* Signal badges */
    .badge-buy   { background:#dcfce7; color:#15803d; }
    .badge-watch { background:#dbeafe; color:#1d4ed8; }
    .badge-hold  { background:#f3f4f6; color:#4b5563; }
    .badge-sell  { background:#fee2e2; color:#b91c1c; }

    /* Score ring animation */
    @keyframes ring-in { from { stroke-dashoffset: 251; } }
    .score-ring { animation: ring-in .6s ease-out forwards; }

    /* Log terminal */
    #log-box {
      font-family: 'Menlo','Monaco','Consolas',monospace;
      font-size: .7rem; line-height: 1.6;
    }

    /* Report section accordion */
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] > summary .chevron { transform: rotate(90deg); }
    .chevron { transition: transform .2s; display: inline-block; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9px; }

    /* Chip */
    .chip { cursor: pointer; transition: all .12s; user-select: none; }
    .chip:hover { border-color: #3b82f6; color: #1d4ed8; background: #eff6ff; }
    .chip.selected { border-color: #3b82f6; color: #1d4ed8; background: #eff6ff; font-weight: 600; }

    /* Server status dot */
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.online  { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }
    .status-dot.offline { background: #d1d5db; }
    .status-dot.checking{ background: #fbbf24; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* Skeleton loader */
    .skeleton { background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
                background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius:.375rem; }
    @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

    /* Toast */
    #toast { transition: opacity .25s, transform .25s; }
    #toast.hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ══════════════ HEADER ══════════════ -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-40">
  <div class="max-w-4xl mx-auto px-4 h-14 flex items-center gap-4">

    <!-- Brand -->
    <div class="flex items-center gap-2 flex-shrink-0">
      <span class="text-xl">📈</span>
      <span class="font-bold text-gray-900 text-sm tracking-tight">股票分析 Portal</span>

</header>

<main class="max-w-4xl mx-auto px-4 py-6">

<div id="modal" class="fixed inset-0 z-50 hidden">

<script>

// ── js/components/toast.js ──────────────────────────────
/**
 * components/toast.js — 轻量通知条
 */
class Toast {
  constructor() { this._el = null; this._timer = null; }
  _el_() {
    if (!this._el) this._el = document.getElementById('toast');
    return this._el;
  }
  show(msg, type = 'info', ms = 2400) {
    const el = this._el_();
    if (!el) return;
    const colors = { success: 'bg-green-600', error: 'bg-red-600', warning: 'bg-amber-500', info: 'bg-gray-800' };
    el.removeAttribute('class');
    el.className = `fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-white text-xs font-medium shadow-lg whitespace-nowrap ${colors[type] || colors.info}`;
    el.textContent = msg;
    el.style.display = '';
    if (this._timer) clearTimeout(this._timer);
    this._timer = setTimeout(() => { el.style.display = 'none'; }, ms);
  }
}
const toast = new Toast();

// ── js/components/modal.js ──────────────────────────────
/**
 * components/modal.js — 保存配置弹窗
 */

const SERVER_MODAL = 'http://127.0.0.1:7788';

class Modal {
  constructor() {
    this._el     = null;
    this._store  = null;
    this._toast  = null;
    this._online = false;
  }

  init(store, serverUrl, toast) {
    this._store = store;
    this._toast = toast;
    this._el = document.getElementById('modal');

    document.getElementById('modal-bg')?.addEventListener('click', () => this.hide());
    document.getElementById('modal-close')?.addEventListener('click', () => this.hide());
    document.getElementById('modal-close2')?.addEventListener('click', () => this.hide());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') this.hide(); });

    // 复制按钮
    document.getElementById('modal-copy')?.addEventListener('click', async () => {
      const ta = document.getElementById('modal-json');
      try {
        await navigator.clipboard.writeText(ta.value);
        this._toast.show('已复制到剪贴板', 'success');
      } catch { ta.select(); }
    });

    // 直接保存按钮
    document.getElementById('modal-btn-save')?.addEventListener('click', () => this._directSave());
  }

  setServerOnline(online) {
    this._online = online;
    this._refreshSaveBtn();
  }

  show(json) {
    document.getElementById('modal-json').value = json;
    document.getElementById('modal-save-msg')?.classList.add('hidden');
    this._refreshSaveBtn();
    this._el?.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  hide() {
    this._el?.classList.add('hidden');
    document.body.style.overflow = '';
  }

  _refreshSaveBtn() {
    const btn  = document.getElementById('modal-btn-save');
    const hint = document.getElementById('modal-server-hint');
    if (!btn) return;
    if (this._online) {
      btn.disabled = false;
      btn.className = 'flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors bg-green-600 hover:bg-green-700 text-white cursor-pointer';
      btn.textContent = '💾 保存';
      if (hint) hint.classList.add('hidden');
    } else {
      btn.disabled = true;
      btn.className = 'flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-200 text-gray-400 cursor-not-allowed';
      btn.textContent = '保存（需服务）';
      if (hint) hint.classList.remove('hidden');
    }
  }

  async _directSave() {
    const json = document.getElementById('modal-json').value;
    const btn  = document.getElementById('modal-btn-save');
    const msg  = document.getElementById('modal-save-msg');
    btn.disabled = true;
    btn.textContent = '⏳ 保存中...';
    try {
      const res  = await fetch(`${SERVER_MODAL}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: json,
        signal: AbortSignal.timeout(5000),
      });
      const data = await res.json();
      if (data.ok) {
        msg.className = 'mt-2 text-xs text-green-700 bg-green-100 rounded-lg px-2 py-1';
        msg.textContent = '✅ 已保存到 config/watchlist.json';
        msg.classList.remove('hidden');
        btn.textContent = '✅ 已保存';
        setTimeout(() => { btn.textContent = '💾 保存'; btn.disabled = false; }, 2000);
      } else throw new Error(data.error);
    } catch (e) {
      msg.className = 'mt-2 text-xs text-red-600 bg-red-50 rounded-lg px-2 py-1';
      msg.textContent = `❌ 保存失败：${e.message}`;
      msg.classList.remove('hidden');
      btn.textContent = '💾 保存';
      btn.disabled = false;
    }
  }
}

const modal = new Modal();

// ── js/components/report-view.js ──────────────────────────────
/**
 * components/report-view.js — 双栏结构化报告渲染组件
 *
 * 接受 merger.py 返回的 JSON，渲染：
 *   左栏：技术面
 *   右栏：基本面 + 产业链
 *   底部：综合结论 + 评分
 */

const SIGNAL_CONFIG = {
  buy:   { label: '买入',  bg: 'bg-green-100',  text: 'text-green-700',  border: 'border-green-300',  dot: '#16a34a' },
  watch: { label: '关注',  bg: 'bg-blue-100',   text: 'text-blue-700',   border: 'border-blue-300',   dot: '#2563eb' },
  hold:  { label: '持有',  bg: 'bg-gray-100',   text: 'text-gray-600',   border: 'border-gray-300',   dot: '#6b7280' },
  sell:  { label: '卖出',  bg: 'bg-red-100',    text: 'text-red-700',    border: 'border-red-300',    dot: '#dc2626' },
};

const DIM_ICONS = {
  technical:   '📊',
  fundamental: '📈',
  industry:    '🏭',
};

class ReportView {
  /**
   * @param {HTMLElement} container  报告挂载节点
   */
  constructor(container) {
    this._container = container;
  }

  /** 渲染结构化报告（merger.py 返回的 JSON 对象） */
  render(report) {
    const { stock_code, stock_name, overall_score, overall_signal,
            overall_signal_label, conclusion, dimensions, generated_at } = report;

    const sig = SIGNAL_CONFIG[overall_signal] || SIGNAL_CONFIG.hold;

    this._container.innerHTML = `
      <!-- 报告头部 -->
      <div class="mb-5 p-4 rounded-xl bg-gradient-to-r from-gray-50 to-blue-50 border border-gray-200">
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <span class="font-bold text-xl text-gray-900">${this._esc(stock_name)}</span>
            <span class="ml-2 font-mono text-sm text-gray-500">${this._esc(stock_code)}</span>
          </div>
          <div class="flex items-center gap-3">
            ${this._scoreBadge(overall_score, overall_signal)}
            <span class="text-xs text-gray-400">${this._fmtTime(generated_at)}</span>
          </div>
        </div>
      </div>

      <!-- 双栏维度报告 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5" id="report-columns"></div>

      <!-- 综合结论 -->
      <div class="p-4 rounded-xl border-2 ${sig.border} ${sig.bg}">
        <div class="flex items-center gap-2 mb-2">
          <span class="text-base font-bold ${sig.text}">🎯 综合结论</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-white/70 ${sig.text} font-medium border ${sig.border}">
            ${overall_signal_label || sig.label}
          </span>
          <span class="text-xs text-gray-500 ml-auto">综合评分 ${overall_score}/100</span>
        </div>
        <p class="text-sm text-gray-700 leading-relaxed">${this._esc(conclusion)}</p>
      </div>
    `;

    // 渲染各维度列
    const colContainer = this._container.querySelector('#report-columns');

    // 技术面单独一栏，基本面+产业链合并一栏
    const techDims  = dimensions.filter(d => d.dimension === 'technical');
    const otherDims = dimensions.filter(d => d.dimension !== 'technical');

    if (techDims.length) {
      const col = document.createElement('div');
      col.className = 'space-y-4';
      techDims.forEach(d => col.appendChild(this._renderDimension(d)));
      colContainer.appendChild(col);
    }

    if (otherDims.length) {
      const col = document.createElement('div');
      col.className = 'space-y-4';
      otherDims.forEach(d => col.appendChild(this._renderDimension(d)));
      colContainer.appendChild(col);
    }
  }

  _renderDimension(dim) {
    const sig  = SIGNAL_CONFIG[dim.signal] || SIGNAL_CONFIG.hold;
    const icon = DIM_ICONS[dim.dimension] || '📋';

    const el = document.createElement('div');
    el.className = 'bg-white border border-gray-200 rounded-xl overflow-hidden';
    el.innerHTML = `
      <!-- 维度头部 -->
      <div class="flex items-center justify-between px-4 py-3 bg-gray-50 border-b border-gray-100">
        <div class="flex items-center gap-2">
          <span class="text-base">${icon}</span>
          <span class="font-semibold text-sm text-gray-800">${this._esc(dim.name)}</span>
          ${dim.error ? '<span class="text-xs text-red-500">⚠️ 分析异常</span>' : ''}
        </div>
        <div class="flex items-center gap-2">
          ${this._scoreBadge(dim.score, dim.signal, 'sm')}
        </div>
      </div>

      <!-- 一句话摘要 -->
      ${dim.summary ? `
        <div class="px-4 py-2 bg-${sig.bg.replace('bg-','')} border-b border-gray-100">
          <p class="text-xs ${sig.text} leading-relaxed">${this._esc(dim.summary)}</p>
        </div>
      ` : ''}

      <!-- 子模块列表 -->
      <div class="divide-y divide-gray-100" id="sections-${dim.dimension}"></div>
    `;

    const sectionsEl = el.querySelector(`#sections-${dim.dimension}`);
    if (dim.error) {
      sectionsEl.innerHTML = `<div class="px-4 py-3 text-sm text-red-500">${this._esc(dim.error)}</div>`;
    } else {
      dim.sections.forEach(sec => sectionsEl.appendChild(this._renderSection(sec)));
    }

    return el;
  }

  _renderSection(sec) {
    const sig = SIGNAL_CONFIG[sec.signal] || SIGNAL_CONFIG.hold;
    const el = document.createElement('details');
    el.className = 'group';
    el.innerHTML = `
      <summary class="flex items-center justify-between px-4 py-2.5 cursor-pointer hover:bg-gray-50 select-none list-none">
        <div class="flex items-center gap-2">
          <span class="text-gray-400 group-open:rotate-90 transition-transform text-xs">▶</span>
          <span class="text-sm font-medium text-gray-700">${this._esc(sec.title)}</span>
        </div>
        <span class="text-xs px-1.5 py-0.5 rounded ${sig.bg} ${sig.text} font-medium">
          ${sig.label}
        </span>
      </summary>
      <div class="px-4 pb-3 pt-1 text-xs text-gray-600 leading-relaxed bg-gray-50/50">
        ${this._mdToHtml(sec.content)}
      </div>
    `;
    // 默认展开评分较高的子模块
    if (sec.score >= 65 || sec.score <= 35) {
      el.setAttribute('open', '');
    }
    return el;
  }

  _scoreBadge(score, signal, size = 'md') {
    const sig = SIGNAL_CONFIG[signal] || SIGNAL_CONFIG.hold;
    const width  = size === 'sm' ? 'w-8 h-8 text-xs' : 'w-12 h-12 text-sm';
    const color  = score >= 70 ? '#16a34a' : score >= 55 ? '#2563eb' : score >= 40 ? '#6b7280' : '#dc2626';
    const radius = size === 'sm' ? 14 : 20;
    const circum = 2 * Math.PI * radius;
    const dash   = (score / 100) * circum;

    return `
      <div class="flex items-center gap-1.5">
        <svg class="${width}" viewBox="0 0 ${radius * 2 + 8} ${radius * 2 + 8}">
          <circle cx="${radius + 4}" cy="${radius + 4}" r="${radius}"
                  fill="none" stroke="#e5e7eb" stroke-width="3"/>
          <circle cx="${radius + 4}" cy="${radius + 4}" r="${radius}"
                  fill="none" stroke="${color}" stroke-width="3"
                  stroke-dasharray="${dash} ${circum}"
                  stroke-dashoffset="${circum * 0.25}"
                  stroke-linecap="round"/>
          <text x="${radius + 4}" y="${radius + 4}" text-anchor="middle"
                dominant-baseline="central" font-size="${size === 'sm' ? 9 : 11}"
                font-weight="bold" fill="${color}">${score}</text>
        </svg>
        <span class="text-xs px-1.5 py-0.5 rounded ${sig.bg} ${sig.text} font-medium">${sig.label}</span>
      </div>
    `;
  }

  /** 极简 Markdown → HTML */
  _mdToHtml(md) {
    if (!md) return '';
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return md.split('\n').map(line => {
      if (/^\*\*(.+)\*\*$/.test(line)) return `<p class="font-semibold text-gray-800 mt-1">${esc(line.replace(/\*\*/g,''))}</p>`;
      if (/^#{1,3} (.+)/.test(line))   return `<p class="font-semibold text-gray-800 mt-1">${esc(line.replace(/^#+\s/,''))}</p>`;
      if (/^[-*] (.+)/.test(line))     return `<p class="pl-2">• ${esc(line.slice(2))}</p>`;
      if (line.trim() === '')          return '';
      let html = esc(line);
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/`(.+?)`/g, '<code class="bg-gray-200 px-0.5 rounded text-blue-700">$1</code>');
      // 符号着色
      html = html.replace(/(✅|🟢)/g, '<span class="text-green-600">$1</span>');
      html = html.replace(/(⚠️|🔴|❌)/g, '<span class="text-red-500">$1</span>');
      return `<p>${html}</p>`;
    }).filter(Boolean).join('\n');
  }

  _fmtTime(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleString('zh-CN', {
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
      });
    } catch { return iso; }
  }

  _esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
}

// ── js/store.js ──────────────────────────────
/**
 * store.js — 全局状态管理 + localStorage 持久化
 */

const KEY = 'dsa_portal_v2';

const DEFAULTS = {
  stock_list: [],
  report_type: 'simple',
  market_review_enabled: true,
  market_review_region: 'cn',
  analysis_delay: 0,
  max_workers: 1,
  force_run: false,
  email: { enabled: true, subject_prefix: 'A股智能分析' },
};

class Store {
  constructor() {
    this._state = this._load();
    this._subs = [];
  }

  get() { return structuredClone(this._state); }

  addStock(raw) {
    const code = raw.trim().toUpperCase();
    if (!code) return { ok: false, msg: '代码不能为空' };
    if (this._state.stock_list.includes(code)) return { ok: false, msg: `${code} 已存在` };
    this._state.stock_list = [...this._state.stock_list, code];
    this._save(); this._emit(); return { ok: true };
  }

  removeStock(code) {
    this._state.stock_list = this._state.stock_list.filter(c => c !== code);
    this._save(); this._emit();
  }

  set(key, value) {
    if (key.includes('.')) {
      const [p, c] = key.split('.');
      this._state[p] = { ...this._state[p], [c]: value };
    } else {
      this._state[key] = value;
    }
    this._save(); this._emit();
  }

  subscribe(fn) { this._subs.push(fn); fn(this.get()); }

  toJSON() {
    return JSON.stringify({
      _schema_version: '1',
      _comment: '由 portal/index.html 生成，提交到仓库后被 portal-daily-analysis.yml 读取',
      updated_at: new Date().toISOString(),
      ...this._state,
    }, null, 2);
  }

  _emit() { const s = this.get(); this._subs.forEach(f => f(s)); }

  _save() {
    try { localStorage.setItem(KEY, JSON.stringify(this._state)); } catch {}
  }

  _load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return this._merge(DEFAULTS, JSON.parse(raw));
    } catch {}
    return structuredClone(DEFAULTS);
  }

  _merge(base, over) {
    const r = structuredClone(base);
    for (const k of Object.keys(over)) {
      if (k in r && typeof r[k] === 'object' && !Array.isArray(r[k]) && r[k] !== null)
        r[k] = this._merge(r[k], over[k]);
      else r[k] = over[k];
    }
    return r;
  }
}

            class="form-input flex-1" autocomplete="off" />

    this._s.subscribe(state => this._render(state));
  }

  _add(input) {
    const r = this._s.addStock(input.value);
    if (r.ok) { input.value = ''; this._t.show('已添加', 'success'); }
    else this._t.show(r.msg, 'warning');
  }

  _render(state) {
    const list  = this._c.querySelector('#wl-list');
    const count = this._c.querySelector('#wl-count');
    if (!list) return;
    const stocks = state.stock_list || [];
    if (!stocks.length) {
      list.innerHTML = `
        <div class="py-12 text-center text-gray-300">
          <div class="text-4xl mb-2">📋</div>
          <p class="text-sm">还没有自选股</p>
        </div>`;
      if (count) count.textContent = '';
      return;
    }
    list.innerHTML = stocks.map((c, i) => `
      <div class="flex items-center justify-between px-4 py-2.5 bg-white rounded-xl border border-gray-100
                  hover:border-blue-200 hover:shadow-sm transition-all group">
        <div class="flex items-center gap-3">
          <span class="text-xs text-gray-300 w-4 text-right">${i + 1}</span>
          <span class="font-mono font-semibold text-sm text-gray-800">${this._esc(c)}</span>

      </div>`).join('');
    list.querySelectorAll('[data-del]').forEach(b =>
      b.addEventListener('click', () => { this._s.removeStock(b.dataset.del); this._t.show('已移除', 'info'); }));
    if (count) count.textContent = `共 ${stocks.length} 只`;
  }

  _esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
}

    this._bindInput('cfg-report-type',   'report_type');
    this._bindInput('cfg-market-region', 'market_review_region');
    this._bindInput('cfg-workers',       'max_workers',    v => Math.max(1, Math.min(5, +v || 1)));
    this._bindInput('cfg-delay',         'analysis_delay', v => Math.max(0, +v || 0));
    this._bindInput('cfg-email-prefix',  'email.subject_prefix');

    this._s.subscribe(state => this._sync(state));
  }

  _row(label, control, hint = '') {
    return `
      <div class="flex items-center justify-between px-5 py-3.5 gap-4">
        <div class="flex-shrink-0">
          <p class="text-sm font-medium text-gray-700">${label}</p>
          ${hint ? `<p class="text-xs text-gray-400 mt-0.5">${hint}</p>` : ''}
        </div>
        <div class="flex-shrink-0">${control}</div>
      </div>`;
  }

  _bindToggle(btnId, thumbId, hiddenId, onChange) {
    const btn    = this._c.querySelector(`#${btnId}`);
    const thumb  = this._c.querySelector(`#${thumbId}`);
    const hidden = this._c.querySelector(`#${hiddenId}`);
    if (!btn) return;
    const setOn = (on) => {
      hidden.checked = on;
      btn.setAttribute('aria-checked', String(on));
      btn.classList.toggle('bg-blue-500', on);
      btn.classList.toggle('bg-gray-200', !on);
      thumb.classList.toggle('translate-x-5', on);
      thumb.classList.toggle('translate-x-0', !on);
      onChange(on);
    };
    btn.addEventListener('click', () => setOn(!hidden.checked));
  }

  _bindInput(id, key, xf = v => v) {
    const el = this._c.querySelector(`#${id}`);
    if (!el) return;
    el.addEventListener('input', () => this._s.set(key, xf(el.value)));
  }

  _sync(state) {
    const sv = (id, val) => { const el = this._c.querySelector(`#${id}`); if (el) el.value = val ?? ''; };
    sv('cfg-report-type',   state.report_type);
    sv('cfg-market-region', state.market_review_region);
    sv('cfg-workers',       state.max_workers);
    sv('cfg-delay',         state.analysis_delay);
    sv('cfg-email-prefix',  state.email?.subject_prefix ?? 'A股智能分析');

    this._applyToggle('cfg-market-review-btn', 'cfg-market-thumb', 'cfg-market-review',
      !!state.market_review_enabled,
      (on) => { const l = this._c.querySelector('#cfg-market-label'); if (l) l.textContent = on ? '已启用' : '已关闭'; });
    this._applyToggle('cfg-force-btn', 'cfg-force-thumb', 'cfg-force', !!state.force_run);
  }

  _applyToggle(btnId, thumbId, hiddenId, on, sideEffect) {
    const btn    = this._c.querySelector(`#${btnId}`);
    const thumb  = this._c.querySelector(`#${thumbId}`);
    const hidden = this._c.querySelector(`#${hiddenId}`);
    if (!btn) return;
    hidden.checked = on;
    btn.setAttribute('aria-checked', String(on));
    btn.classList.toggle('bg-blue-500', on);
    btn.classList.toggle('bg-gray-200', !on);
    thumb.classList.toggle('translate-x-5', on);
    thumb.classList.toggle('translate-x-0', !on);
    sideEffect?.(on);
  }
}

            </button>

      </div>`;

    this._buildDims();
    this._bindEvents();
    this._updateOnlineUI();
    this._report = new ReportView(this._c.querySelector('#report-structured'));
  }

  // ── 维度选择器 ────────────────────────────────────────────
  _buildDims() {
    const list = this._c.querySelector('#dim-list');
    Object.entries(DIM_DEFS).forEach(([dimKey, dimDef]) => {
      const colorMap = { blue: 'blue', emerald: 'emerald', violet: 'violet' };
      const c = colorMap[dimDef.color] || 'blue';
      const wrap = document.createElement('div');
      wrap.className = `border border-gray-100 rounded-xl overflow-hidden`;
      const checked = this._selDims.has(dimKey);
      wrap.innerHTML = `
        <div class="flex items-center gap-3 px-4 py-2.5 bg-gray-50 hover:bg-gray-100 cursor-pointer transition-colors"
             data-dim="${dimKey}">
          <input type="checkbox" id="dim-${dimKey}" ${checked ? 'checked' : ''}
            class="w-4 h-4 accent-${c}-600 cursor-pointer" />
          <label for="dim-${dimKey}" class="text-sm font-medium text-gray-700 cursor-pointer flex-1 select-none">
            ${dimDef.label}
          </label>
          <span class="text-xs text-gray-400">▼ 子模块</span>
        </div>
        <div class="dim-mods ${checked ? '' : 'hidden'} px-4 py-2.5 grid grid-cols-2 sm:grid-cols-3 gap-2 bg-white"
             data-dim="${dimKey}">
          ${Object.entries(dimDef.mods).map(([mk, ml]) => `
            <label class="flex items-center gap-1.5 text-xs text-gray-600 cursor-pointer hover:text-${c}-600">
              <input type="checkbox" class="mod-cb accent-${c}-600 w-3.5 h-3.5"
                data-dim="${dimKey}" data-mod="${mk}"
                ${this._selMods[dimKey]?.has(mk) ? 'checked' : ''} />
              ${ml}
            </label>`).join('')}
        </div>`;
      list.appendChild(wrap);
    });

    // 维度行点击（不点 checkbox 本身时切换）
    list.querySelectorAll('[data-dim]').forEach(row => {
      if (row.classList.contains('dim-mods')) return;
      row.addEventListener('click', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL') return;
        const cb = row.querySelector('input[type=checkbox]');
        cb.checked = !cb.checked; cb.dispatchEvent(new Event('change'));
      });
    });
    list.querySelectorAll('[id^="dim-"]').forEach(cb => {
      cb.addEventListener('change', () => {
        const k = cb.id.replace('dim-', '');
        const modsEl = list.querySelector(`.dim-mods[data-dim="${k}"]`);
        cb.checked ? this._selDims.add(k) : this._selDims.delete(k);
        modsEl?.classList.toggle('hidden', !cb.checked);
      });
    });
    list.querySelectorAll('.mod-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const { dim, mod } = cb.dataset;
        cb.checked ? this._selMods[dim]?.add(mod) : this._selMods[dim]?.delete(mod);
      });
    });
  }

  // ── 自选股芯片 ────────────────────────────────────────────
  _syncChips(state) {
    const chips = this._c.querySelector('#run-chips');
    if (!chips) return;
    const stocks = state.stock_list || [];
    if (!stocks.length) {
      chips.innerHTML = '<span class="text-xs text-gray-300">（自选股为空，先去「自选股」Tab 添加）</span>';
      return;
    }
    chips.innerHTML = stocks.map(code => `
      <button class="chip px-2.5 py-1 text-xs border border-gray-200 rounded-lg font-mono text-gray-600"
              data-code="${code}">${code}</button>`).join('');
    chips.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        this._c.querySelector('#run-code').value = btn.dataset.code;
        chips.querySelectorAll('.chip').forEach(b => b.classList.toggle('selected', b === btn));
      });
    });
  }

  // ── 在线状态 UI 更新 ───────────────────────────────────────
  _updateOnlineUI() {
    const dot   = this._c.querySelector('#run-dot');
    const label = this._c.querySelector('#run-svc-label');
    const chip  = this._c.querySelector('#run-svc-chip');
    if (!dot) return;
    if (this._online) {
      dot.className   = 'status-dot online';
      label.textContent = '本地服务在线';
      chip.className = chip.className.replace(/bg-\S+|border-\S+|text-\S+/g, '').trim()
        + ' bg-green-50 border-green-200 text-green-700';
    } else {
      dot.className   = 'status-dot offline';
      label.textContent = '纯静态模式';
      chip.className = chip.className.replace(/bg-\S+|border-\S+|text-\S+/g, '').trim()
        + ' bg-gray-50 border-gray-200 text-gray-400';
    }
  }

  // ── 事件绑定 ──────────────────────────────────────────────
  _bindEvents() {
    this._c.querySelector('#btn-deep').addEventListener('click',   () => this._deepAnalyze());
    this._c.querySelector('#btn-market').addEventListener('click', () => this._quickRun('market'));
    this._c.querySelector('#btn-full').addEventListener('click',   () => this._quickRun('full'));
    this._c.querySelector('#run-code').addEventListener('keydown', e => { if (e.key === 'Enter') this._deepAnalyze(); });
    this._c.querySelector('#btn-clear-log').addEventListener('click', () => {
      this._c.querySelector('#log-box').innerHTML = '';
    });
    this._c.querySelector('#btn-copy-report').addEventListener('click', async () => {
      const box = this._c.querySelector('#report-markdown');
      const sbox = this._c.querySelector('#report-structured');
      try {
        await navigator.clipboard.writeText(box.dataset.raw || sbox.innerText || '');
        this._t.show('已复制', 'success');
      } catch { this._t.show('复制失败', 'warning'); }
    });
  }

  // ── 自动启动 server ────────────────────────────────────────
  /**
   * 点击"直接分析"或"直接保存"时调用。
   * 若 server 已在线，直接返回 true。
   * 若未在线，尝试通过 fetch 触发 server（实际上由用户后台运行 server.py，
   * 这里弹一次提示，然后轮询等待最多 20 秒）。
   */
  async _ensureServer() {
    if (this._online) return true;
    if (this._serverStarting) {
      this._t.show('正在等待本地服务启动...', 'warning');
      return false;
    }
    this._serverStarting = true;

    // 弹出提示
    this._t.show('需要本地服务，请运行：python portal/server.py', 'warning', 8000);

    // 轮询等待 20 秒
    const deadline = Date.now() + 20000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 1000));
      try {
        const r = await fetch(`${SERVER_RUN}/health`, { signal: AbortSignal.timeout(1000) });
        if (r.ok) {
          this._online = true;
          this._serverStarting = false;
          this._updateOnlineUI();
          // 通知 app.js 的全局状态（通过自定义事件）
          window.dispatchEvent(new CustomEvent('server-online'));
          return true;
        }
      } catch {}
    }
    this._serverStarting = false;
    this._t.show('本地服务未启动，请先运行 server.py', 'error');
    return false;
  }

  // ── 深度分析 ──────────────────────────────────────────────
  async _deepAnalyze() {
    const code = this._c.querySelector('#run-code').value.trim().toUpperCase();
    const name = this._c.querySelector('#run-name').value.trim();
    if (!code) { this._t.show('请输入股票代码', 'warning'); return; }

    const dims = [...this._selDims];
    if (!dims.length) { this._t.show('请至少选择一个分析维度', 'warning'); return; }

    // ★ 自动激活 server
    const ok = await this._ensureServer();
    if (!ok) return;

    const modulesMap = Object.fromEntries(dims.map(d => [d, [...(this._selMods[d] || [])]]));
    this._prepareLog(`🔬 深度分析：${name || code}（${code}）`);

    let taskId;
    try {
      const res = await fetch(`${SERVER_RUN}/analyze`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stock_code: code, stock_name: name || code, dimensions: dims, modules: modulesMap }),
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error);
      taskId = d.task_id;
    } catch (e) {
      this._t.show(`启动失败: ${e.message}`, 'error');
      this._resetBtns(); return;
    }
    this._listenSSE(taskId, 'structured');
  }

  // ── 快速任务 ──────────────────────────────────────────────
  async _quickRun(mode) {
    // ★ 自动激活 server
    const ok = await this._ensureServer();
    if (!ok) return;

    const force = this._c.querySelector(mode === 'market' ? '#run-market-force' : '#run-full-force')?.checked;
    this._prepareLog(mode === 'market' ? '🌐 大盘复盘' : '⚡ 全量分析');

    let taskId;
    try {
      const res = await fetch(`${SERVER_RUN}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode, force_run: !!force, no_notify: true }),
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error);
      taskId = d.task_id;
    } catch (e) {
      this._t.show(`启动失败: ${e.message}`, 'error');
      this._resetBtns(); return;
    }
    this._listenSSE(taskId, 'markdown');
  }

  // ── 日志区准备 ────────────────────────────────────────────
  _prepareLog(title) {
    if (this._sse) { this._sse.close(); this._sse = null; }
    const logSec = this._c.querySelector('#run-log-section');
    const rptSec = this._c.querySelector('#run-report-section');
    logSec.classList.remove('hidden');
    rptSec.classList.add('hidden');
    this._c.querySelector('#log-box').innerHTML = '';
    this._c.querySelector('#report-structured').innerHTML = '';
    const badge = this._c.querySelector('#run-badge');
    badge.textContent = '运行中';
    badge.className = 'text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-medium';
    this._appendLog(title, 'info');
    this._disableBtns();
  }

  // ── SSE 监听 ──────────────────────────────────────────────
  _listenSSE(taskId, rtype) {
    const sse = new EventSource(`${SERVER_RUN}/run/stream/${taskId}`);
    this._sse = sse;
    const box = this._c.querySelector('#log-box');
    sse.onmessage = e => {
      const d = JSON.parse(e.data);
      this._appendLog(d.log, d.status === 'error' ? 'error' : 'default');
    };
    sse.addEventListener('done', e => {
      sse.close(); this._sse = null;
      const d = JSON.parse(e.data);
      const ok = d.status === 'done';
      const badge = this._c.querySelector('#run-badge');
      badge.textContent = ok ? '完成 ✓' : '失败 ✗';
      badge.className = `text-xs px-2 py-0.5 rounded-full font-medium ${ok ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
      this._resetBtns();
      if (d.has_report) this._loadReport(taskId, d.report_type || rtype);
    });
    sse.onerror = () => {
      sse.close(); this._sse = null;
      this._appendLog('⚠️ 连接断开，拉取结果...', 'warn');
      setTimeout(() => this._loadReport(taskId, rtype), 600);
      this._resetBtns();
    };
  }

  async _loadReport(taskId, rtype) {
    try {
      const res = await fetch(`${SERVER_RUN}/run/report/${taskId}`);
      const d = await res.json();
      const box = this._c.querySelector('#log-box');
      if (d.logs) {
        const ex = box.children.length;
        d.logs.slice(ex).forEach(l => this._appendLog(l));
      }
      if (d.report) {
        rtype === 'structured' ? this._showStructured(d.report) : this._showMarkdown(d.report);
      }
    } catch {}
  }

  _showStructured(json) {
    try {
      const rpt = typeof json === 'string' ? JSON.parse(json) : json;
      const sec = this._c.querySelector('#run-report-section');
      this._c.querySelector('#report-markdown').classList.add('hidden');
      sec.classList.remove('hidden');
      this._report.render(rpt);
      sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch { this._showMarkdown(String(json)); }
  }

  _showMarkdown(md) {
    const sec = this._c.querySelector('#run-report-section');
    const el  = this._c.querySelector('#report-markdown');
    this._c.querySelector('#report-structured').innerHTML = '';
    el.dataset.raw = md;
    el.innerHTML   = this._md(md);
    el.classList.remove('hidden');
    sec.classList.remove('hidden');
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  _appendLog(line, type = 'default') {
    const box = this._c.querySelector('#log-box');
    if (!line || !box) return;
    const div = document.createElement('div');
    div.className = 'text-xs leading-relaxed font-mono';
    const colors = {
      info:    '#6ee7b7', error: '#fca5a5',
      warn:    '#fcd34d', default: '#d1fae5',
    };
    let col = colors.default;
    if (/✅|成功|完成/.test(line))      col = colors.info;
    else if (/❌|失败|ERROR/.test(line)) col = colors.error;
    else if (/⚠|WARNING/.test(line))    col = colors.warn;
    div.style.color = col;
    div.textContent = line;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  _disableBtns() {
    ['#btn-deep','#btn-market','#btn-full'].forEach(s =>
      this._c.querySelector(s) && (this._c.querySelector(s).disabled = true));
  }
  _resetBtns() {
    ['#btn-deep','#btn-market','#btn-full'].forEach(s =>
      this._c.querySelector(s) && (this._c.querySelector(s).disabled = false));
  }

  _md(md) {
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return md.split('\n').map(l => {
      if (/^### (.+)/.test(l)) return `<h3 class="font-bold mt-3 mb-1 text-sm">${esc(l.slice(4))}</h3>`;
      if (/^## (.+)/.test(l))  return `<h2 class="font-bold mt-4 mb-2 text-base border-b pb-1">${esc(l.slice(3))}</h2>`;
      if (/^# (.+)/.test(l))   return `<h1 class="font-bold mt-5 mb-2 text-lg">${esc(l.slice(2))}</h1>`;
      if (/^---+$/.test(l))    return '<hr class="my-3 border-gray-200"/>';
      if (/^[-*] (.+)/.test(l)) return `<p class="ml-4">• ${esc(l.slice(2))}</p>`;
      if (!l.trim()) return '<br/>';
      let h = esc(l);
      h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      h = h.replace(/`(.+?)`/g,'<code class="bg-gray-100 px-1 rounded text-blue-700 text-xs">$1</code>');
      return `<p>${h}</p>`;
    }).join('\n');
  }
}

// ── js/app.js ──────────────────────────────
/**
 * app.js — 主入口：Tab 路由 + 服务状态轮询 + 底栏 + Modal
 */

const SERVER_APP = 'http://127.0.0.1:7788';

const TABS = [
  { id: 'run',       icon: '▶',  label: '立即运行', Cls: RunTab },
  { id: 'watchlist', icon: '☰',  label: '选股',     Cls: WatchlistTab },
  { id: 'settings',  icon: '⚙', label: '设置',     Cls: SettingsTab },
  { id: 'guide',     icon: '?',  label: '说明',     Cls: GuideTab },
];

class App {
  constructor() {
    this._instances = {};
    this._activeId  = 'run';
    this._online    = false;
  }

  init() {
    this._buildNav();
    this._buildPanels();
    modal.init(store, SERVER_APP, toast);
    this._bindSave();
    this._bindFooter();
    this._pollServer();
    this._restoreTab();
  }

  // ── Nav ─────────────────────────────────────────────────
  _buildNav() {
    const nav = document.getElementById('tab-nav');
    TABS.forEach(({ id, icon, label }) => {
      const btn = document.createElement('button');
      btn.id = `nav-${id}`;
      btn.className = 'nav-tab flex-1 flex items-center justify-center gap-1 py-1.5 text-xs font-medium text-gray-500 rounded-lg';
      btn.innerHTML = `<span>${icon}</span><span>${label}</span>`;
      btn.addEventListener('click', () => this._switchTab(id));
      nav.appendChild(btn);
    });
  }

  _buildPanels() {
    const content = document.getElementById('tab-content');
    TABS.forEach(({ id, Cls }) => {
      const panel = document.createElement('div');
      panel.id = `panel-${id}`;
      panel.className = 'tab-panel';
      content.appendChild(panel);
      const inst = new Cls(panel, store, toast);
      inst.init();
      this._instances[id] = inst;
    });
  }

  _switchTab(id) {
    this._activeId = id;
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    document.getElementById(`panel-${id}`)?.classList.add('active');
    document.getElementById(`nav-${id}`)?.classList.add('active');
    try { sessionStorage.setItem('dsa_tab', id); } catch {}
  }

  _restoreTab() {
    const saved = (() => { try { return sessionStorage.getItem('dsa_tab'); } catch {} })();
    this._switchTab(TABS.some(t => t.id === saved) ? saved : 'run');
  }

  // ── Server poll ─────────────────────────────────────────
  async _pollServer() {
    const check = async () => {
      let ok = false;
      try {
        const r = await fetch(`${SERVER_APP}/health`, { signal: AbortSignal.timeout(1500) });
        ok = r.ok;
      } catch {}
      if (ok !== this._online) {
        this._online = ok;
        this._updateStatusUI(ok);
        // 通知 RunTab
        this._instances['run']?.setServerStatus?.(ok);
      }
    };
    await check();
    setInterval(check, 5000);
  }

  _updateStatusUI(online) {
    const dot   = document.getElementById('status-dot');
    const label = document.getElementById('status-label');
    if (!dot || !label) return;
    dot.className   = `status-dot ${online ? 'online' : 'offline'}`;
    label.textContent = online ? '本地服务在线' : '纯静态模式';
    label.className   = `text-xs ${online ? 'text-green-600 font-medium' : 'text-gray-400'}`;
    // 通知 modal
    modal.setServerOnline(online);
  }

  // ── Footer ───────────────────────────────────────────────
  _bindFooter() {
    store.subscribe(() => {
      const el = document.getElementById('footer-time');
      if (!el) return;
      el.textContent = `上次编辑 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`;
    });
  }

  _bindSave() {
    document.getElementById('btn-save')?.addEventListener('click', () => {
      modal.show(store.toJSON());
    });
  }
}

document.addEventListener('DOMContentLoaded', () => new App().init());
</script>
</body>
</html>
